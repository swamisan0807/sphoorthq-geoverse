name: Deploy web UI to GitHub Pages

# Publishes ONLY the built web UI (apps/web/dist), never the repository itself.
# The site is a public showcase of the About page and its measured results.
# There is no backend on GitHub Pages, so the interactive tools need an API:
# set the repository variable API_BASE_URL (Settings > Secrets and variables >
# Actions > Variables) to a hosted API address to enable sign-in, and add the
# site's origin to that API's CORS_ORIGINS. Without it, visitors see the About page only.
#
# One-time setup: Settings > Pages > Source: "GitHub Actions".
# GitHub Pages from a private repository needs a paid GitHub plan.

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build for the Pages address
        working-directory: apps/web
        env:
          VITE_SHOWCASE: "true"
          VITE_API_BASE: ${{ vars.API_BASE_URL }}
        # the base path is passed here, so vite.config.ts and the FastAPI-served build are unchanged
        run: npm run build -- --base=${{ steps.pages.outputs.base_path }}/

      - name: Add single-page-app fallback
        # Pages serves 404.html for unknown paths, so /about and /login still load on refresh
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
