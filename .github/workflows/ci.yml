name: CI

# Runs the checks that do not need the MSTAR or SARBake data. Those files are not
# in the repository (datasets/ is git-ignored), so the tests that exercise real
# chips skip themselves here. Run the full suite locally with the data in place.
# This workflow only checks the code. It does not publish anything.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch: the default Linux wheel pulls in CUDA libraries the tests never use
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # notebook tooling is not needed to run the tests
          grep -v -E '^(jupyter|jupyterlab|notebook|ipykernel)\b' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt

      - name: Lint for real errors
        run: ruff check apps utils scripts tests --select F,E9

      - name: Run tests
        env:
          # keep job history and accounts on local disk, never in cloud storage
          STATE_S3_BUCKET: ""
        run: python -m pytest tests -q -rs

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build
