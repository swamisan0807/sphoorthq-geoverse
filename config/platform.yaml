# Credential/config reference for the live app's auth + quantum paths.
# Nothing here is a secret - these are the ENV VAR NAMES the code reads, not
# values. Set them in your shell; nothing in this repo reads a .env
# automatically.

qml:
  classiq:
    env: [CLASSIQ_AUTH_ORGANIZATION]
    note: >
      utils/qml/classiq_qaoa.py (apps/api/routers/mstar.py's QAOA path) - there is no
      local-simulator fallback: classiq.synthesize()/ExecutionSession are real round
      trips to the Classiq platform even for its own "simulator" backend, so a
      missing/unapproved account surfaces as a real error, not a silent fallback.
      One-time setup per machine: run `classiq.authenticate()` interactively (browser
      device-code login) - this caches a session token locally, after which no further
      env vars or logins are needed for that machine. CLASSIQ_AUTH_ORGANIZATION scopes
      the login to a specific org rather than a personal one;
      utils/qml/classiq_qaoa.py's _configure_classiq_environment() sets it
      automatically from %APPDATA%\classiq\config.env if not already set in the
      environment. Windows also needs the CredWrite keyring workaround (see README.md
      "Authenticate with Classiq") - also handled automatically by that same
      _configure_classiq_environment() call.

state:
  s3:
    env: [STATE_S3_BUCKET]
    optional_env: [STATE_S3_PREFIX, STATE_S3_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN]
    note: >
      utils/core/cloud_state.py - when STATE_S3_BUCKET is set, the model registry
      (utils/registry/model_registry.py) and job/run history (utils/jobs/engine.py)
      read and write S3 as the source of truth instead of local disk under
      datasets/processed/ and datasets/reports/. Without STATE_S3_BUCKET set, falls
      back to local disk - explicitly logged, never silent. Neither of these is on
      the live app's actual request path (see mstar.py) but both are still real,
      working code.

auth:
  forgot_password_email:
    env: [SMTP_HOST, SMTP_USER, SMTP_PASSWORD]
    optional_env: [SMTP_PORT, SMTP_FROM, SMTP_USE_TLS, WEB_BASE_URL]
    note: >
      utils/auth/mailer.py sends the reset link over real SMTP (e.g. smtp.gmail.com:587
      with a Gmail App Password as SMTP_PASSWORD - a regular account password will be
      rejected). Without these set, it falls back to writing the message to
      datasets/metadata/outbox/ and the API response includes the reset link directly,
      so the flow still works end-to-end for local/dev use.
  auth0:
    env: [AUTH0_DOMAIN, AUTH0_CLIENT_ID, AUTH0_CLIENT_SECRET]
    optional_env: [WEB_BASE_URL]
    note: >
      utils/auth/auth0.py + apps/api/routers/auth.py's /api/auth/auth0/login and
      /api/auth/auth0/callback routes - server-side OAuth2 Authorization Code flow.
      Ends at the exact same session JWT (utils/auth/tokens.issue_token) password
      login produces. Without AUTH0_DOMAIN/AUTH0_CLIENT_ID/AUTH0_CLIENT_SECRET set,
      /api/auth/auth0/login returns 501, and the "Log in with Auth0" button just
      doesn't work - explicit, not a silent fallback.

      One manual step this can't do for you: the Auth0 application's dashboard needs
      this exact URL added to "Allowed Callback URLs" -
      {WEB_BASE_URL or the API's own origin}/api/auth/auth0/callback.
